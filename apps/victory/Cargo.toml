[package]
name = "victory"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
victory-core.workspace = true
victory-formats.workspace = true
victory-pe.workspace = true
victory-loader.workspace = true
victory-hle.workspace = true
victory-shader = { workspace = true, features = ["host"] }
victory-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[features]
default = ["mimalloc"]
# mimalloc (MIT) as the global allocator instead of the Windows heap: the submitting thread spent
# about a quarter of its samples in the Windows heap (its lock shared by some 30 busy threads).
mimalloc = ["dep:mimalloc"]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "victory-core/diagnostics",
    "victory-hle/diagnostics",
    "victory-loader/diagnostics",
    "victory-shader/diagnostics",
]
# Only for a build with `-Cprofile-generate` (profile-guided optimization): writes the profile
# every `VICTORY_PGO_DUMP_SECS` seconds (default 20), as the game is ended without a clean exit.
pgo = []

[lints]
workspace = true
