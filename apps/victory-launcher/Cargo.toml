[package]
name = "victory-launcher"
description = "VIctoryUnified's launcher: game folder, presets, upscaling and frame generation, tools."
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
publish.workspace = true

[[bin]]
name = "VIctoryUnified"
path = "src/main.rs"

[dependencies]
eframe = "0.34"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[lints]
workspace = true
